# Services that are required, but which may be run outside of containers as part of development, etc.  Starting container versions of these services is
# optional under those conditions.
#
# This is a convenience file for running the latest images for each container as part of a staging or internal deployment phase.  For production deployments see docker-compose.services.yml.
services:
  api:
    image: leapscientific/nmcp-api:3.0.15
    pull_policy: always
    hostname: nmcp-api
    environment:
      NODE_ENV: production
      NMCP_CCF_30_ONTOLOGY_PATH: "${NMCP_ONTOLOGY_PATH}"
      NMCP_AUTH_REQUIRED: true
      NMCP_SERVER_KEY: "${NMCP_SERVER_KEY}"
      NMCP_AUTHENTICATION_API_APP_ID: "${NMCP_AUTHENTICATION_API_APP_ID}"
      NMCP_AUTHENTICATION_TENANT_ID: "${NMCP_AUTHENTICATION_TENANT_ID}"
      NMCP_DATABASE_PW: "${NMCP_DATABASE_PW}"
      NMCP_INFLUX_DB_TOKEN: "${NMCP_INFLUX_DB_TOKEN}"
      NMCP_DOI_API_URL: "${NMCP_DOI_URL}"
      NMCP_DOI_API_HOST: "${NMCP_DOI_HOST}"
      NMCP_DOI_API_PREFIX: "${NMCP_DOI_PREFIX}"
      NMCP_DOI_API_USER: "${NMCP_DOI_USER}"
      NMCP_DOI_API_PASSWORD: "${NMCP_DOI_PASSWORD}"
      NMCP_EXPERIMENTAL_ENV: "${NMCP_EXPERIMENTAL_ENV}"
    volumes:
      - "${NMCP_LOG_VOLUME}:/var/log/nmcp"
      - "${NMCP_ONTOLOGY_LOCATION}:${NMCP_ONTOLOGY_LOCATION}"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5000/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    ports:
      - "9671:5000"
    networks:
      - back_tier
    restart: unless-stopped

  client:
    image: leapscientific/nmcp-client:3.0.14
    pull_policy: always
    hostname: nmcp-client
    environment:
      NODE_ENV: production
      NMCP_API_HOST: nmcp-api
      NMCP_PRECOMPUTED_OUTPUT: "${NMCP_PRECOMPUTED_OUTPUT}"
      NMCP_GOOGLE_ANALYTICS_TAG: "${NMCP_GOOGLE_ANALYTICS_TAG}"
      NMCP_DOI_HANDLER: "${NMCP_DOI_HANDLER}"
      NMCP_EXPERIMENTAL_ENV: "${NMCP_EXPERIMENTAL_ENV}"
    volumes:
      - "${NMCP_LOG_VOLUME}:/var/log/nmcp"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "9693:5000"
    networks:
      - back_tier
    restart: unless-stopped

  export:
    image: leapscientific/nmcp-export:3.0.6
    pull_policy: always
    hostname: nmcp-export
    environment:
      NODE_ENV: production
      NMCP_EXPERIMENTAL_ENV: "${NMCP_EXPERIMENTAL_ENV}"
      NMCP_AUTHENTICATION_KEY: "${NMCP_SERVER_KEY}"
    volumes:
      - "${NMCP_LOG_VOLUME}:/var/log/nmcp"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "9692:5000"
    networks:
      - back_tier
    restart: unless-stopped

  precomputed-worker:
    image: leapscientific/nmcp-precomputed-worker:3.0.5
    pull_policy: always
    hostname: precomputed-worker
    environment:
      NMCP_EXPERIMENTAL_ENV: "${NMCP_EXPERIMENTAL_ENV}"
      GRAPHQL_URL: http://nmcp-api:5000/graphql
      SERVER_AUTHENTICATION_KEY: "${NMCP_SERVER_KEY}"
      PRECOMPUTED_OUTPUT: "${NMCP_PRECOMPUTED_OUTPUT}"
    volumes:
      - "${NMCP_LOG_VOLUME}:/var/log/nmcp"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - back_tier
    restart: unless-stopped

  quality-api:
    image: leapscientific/nmcp-qc:3.0.3
    pull_policy: always
    hostname: quality-api
    environment:
      NMCP_EXPERIMENTAL_ENV: "${NMCP_EXPERIMENTAL_ENV}"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "9694:5000"
    volumes:
      - "${NMCP_LOG_VOLUME}:/var/log/nmcp"
    networks:
      - back_tier
    restart: unless-stopped

volumes:
  log_output:

networks:
  back_tier:
